name: Release

# Builds the installers, Widevine-signs the Windows build, and puts everything in a DRAFT GitHub
# release. Nothing is public until a person has tested the build (docs/RELEASE_CHECKLIST.md) and
# pressed Publish.
#
# Signing happens only here, on a tag or a deliberate run, never on pushes or pull requests:
# Castlabs asks that a valid signature is not re-requested routinely, and a workflow that pull
# requests can trigger would hand the signing account to anyone who opens one.
#
# macOS is left out until notarization is funded: on macOS 15+ an un-notarized download cannot be
# opened the normal way, which reads as a broken app. See docs/TODO.md, Milestone 4.
#
# Actions are pinned to full commit hashes because this workflow holds the Castlabs account.
on:
  push:
    tags: ['v*']
  # Only offered once this file is on the default branch (a GitHub rule). Until `rewrite` is merged,
  # release by pushing a tag.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancel one halfway through signing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    # Write access only because draft releases are invisible without it, and this job has to see
    # an earlier run's draft. It runs nothing but checkout and the GitHub CLI.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json is the version. A tag that disagrees would publish installers, update feeds
      # and release notes that each name a different version.
      - name: Read the version and check the tag
        id: read
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version. Tag $tag, or change the version first."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # Checked before building, so a repeat run stops here instead of signing again for nothing.
      - name: Stop if this version already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$TAG already has a release (perhaps a draft from an earlier run). Delete it, or change the version, then run this again."
            exit 1
          fi

  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A release must ship the Electron package.json names: checked against GitHub's tag too.
      - run: node scripts/verify-electron.mjs --remote
      - run: npm run check
      - run: npm test

  windows:
    name: Windows (Widevine-signed)
    needs: [version, check]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # First, so a missing secret fails in seconds rather than after the build.
      - name: Require the Castlabs account
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::error::Add the EVS_ACCOUNT_NAME and EVS_PASSWD repository secrets (your Castlabs EVS login). Without a Widevine signature the build greys out and skips protected tracks."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Pinned: the signing tool reads the account from EVS_ACCOUNT_NAME and EVS_PASSWD, and
      # EVS_NO_ASK makes it fail instead of waiting for input (checked in castlabs-evs 1.3.2).
      - name: Install Castlabs' signing tool
        run: python -m pip install castlabs-evs==1.3.2

      - run: npm ci
      # Not `npm run build`: that runs the whole check again, which the check job has done.
      - run: npx electron-vite build

      # STRICT_VMP_SIGNING makes scripts/vmp-sign.js fail the build when it cannot sign, instead
      # of shipping a client that skips DRM tracks. It is the literal string 'true' and never
      # derived from whether a secret is set, which would fail open.
      - name: Package and Widevine-sign
        env:
          STRICT_VMP_SIGNING: 'true'
          EVS_PYTHON: python
          EVS_NO_ASK: '1'
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: npx electron-builder --win --publish never

      - name: Check the fuses
        run: node scripts/verify-fuses.mjs release/win-unpacked/BetterSoundCloud.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (AppImage, deb, rpm)
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The .rpm needs rpmbuild. Linux needs no Widevine signature.
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --linux --publish never

      - name: Check the fuses
        run: node scripts/verify-fuses.mjs release/linux-unpacked/bettersoundcloud

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the GitHub release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Windows and macOS builds are not code-signed yet, so a checksum is the only way a user can
      # tell the file they downloaded is the one built here.
      - name: Write the SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          {
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

          flags=(--draft --generate-notes --notes-file notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "BetterSoundCloud $VERSION" "${flags[@]}"
