name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Unsigned on CI — VMP signing needs EVS credentials and belongs to the release
      # workflow. STRICT_VMP_SIGNING is deliberately unset here so scripts/sign-vmp.js
      # warns and continues. It is set to `true` in the release job, where a build that
      # cannot be signed MUST fail rather than silently ship a client that cannot play
      # DRM tracks. That fail-open default is why soundcloud-rpc's shipped binaries
      # cannot be assumed signed either.
      - run: npm run pack
